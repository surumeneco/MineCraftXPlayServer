name: CI

on:
  push:
    branches:
      - feature/territory-bluemap-sync
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  verify-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Launcher
        run: javac Launcher.java
      - name: Verify BlueMap territory config wiring
        shell: bash
        run: |
          test -f plugins/BlueMap/maps/territories.conf
          grep -F 'include "territories.conf"' plugins/BlueMap/maps/world.conf
